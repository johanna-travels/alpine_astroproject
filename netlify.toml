[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  NODE_OPTIONS = "--dns-result-order=ipv4first"
  SITE_URL = "https://voyaflair.com"
  BASE_PATH = "/"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY,RESEND_API_KEY,NEWSLETTER_ADMIN_SECRET"

[functions]
  node_bundler = "esbuild"

[functions.environment]
  NODE_OPTIONS = "--dns-result-order=ipv4first"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Static HTML is pre-rendered at build time; cache at the edge to cut repeat-visit TTFB.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
