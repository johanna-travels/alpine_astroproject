[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.environment]
  NODE_VERSION = "22.12.0"
  NODE_OPTIONS = "--dns-result-order=ipv4first"
  SITE_URL = "https://voyaflair.com"
  BASE_PATH = "/"
  PUBLIC_GA_MEASUREMENT_ID = "G-CCKG31HHS9"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY,RESEND_API_KEY,NEWSLETTER_ADMIN_SECRET"

[functions]
  node_bundler = "esbuild"

[functions.environment]
  NODE_OPTIONS = "--dns-result-order=ipv4first"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# HTML: revalidate on every visit so deploys show up immediately.
# Hashed assets keep long-lived cache rules in public/_headers.
# HTML: revalidate on every visit so deploys show up immediately.
# Hashed assets keep long-lived cache rules in public/_headers.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
