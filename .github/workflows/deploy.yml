name: Deploy to GitHub Pages

# Paused: pushes stay on Git only. Run manually from Actions when you want to deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub project sites live under /alpine_astroproject/ — Netlify uses BASE_PATH=/ via netlify.toml
      SITE_URL: https://johanna-travels.github.io
      BASE_PATH: /alpine_astroproject/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install
      - uses: actions/configure-pages@v5
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
